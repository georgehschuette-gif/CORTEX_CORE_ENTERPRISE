[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-core"
version = "3.0.0"
description = "Advanced Neural-Symbolic AI System with Security & Autonomy"
authors = [
    {name = "Cortex Core Team", email = "team@cortex-core.ai"}
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "torch>=1.9.0",
    "pyyaml>=6.0",
    "fastapi>=0.85.0",
    "uvicorn>=0.18.0",
    "pydantic>=1.10.0",
    "click>=8.0.0",
    "tqdm>=4.62.0",
    "cachetools>=5.2.0",
    "python-dotenv>=0.19.0",
    "structlog>=22.1.0",
    "prometheus-client>=0.14.0",
]
requires-python = ">=3.8"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["ai", "neural-symbolic", "enterprise", "distributed", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
enterprise = [
    "aioredis>=2.0.0",
    "sqlalchemy>=1.4.0",
    "cryptography>=36.0.0",
    "kubernetes>=24.2.0",
    "boto3>=1.26.0",
    "azure-identity>=1.12.0",
    "google-cloud-storage>=2.7.0",
    "opentelemetry-distro>=0.42b0",
    "opentelemetry-exporter-jaeger>=1.21.0",
    "datadog>=0.44.0",
    "dask>=2022.12.0",
    "ray>=2.2.0",
    "pyjwt>=2.6.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.5",
    "psycopg2-binary>=2.9.5",
    "pymongo>=4.3.2",
    "redis>=4.4.0",
    "pika>=1.3.0",
    "kafka-python>=2.0.2",
    "azure-servicebus>=7.8.0",
    "pinecone-client>=2.2.1",
    "qdrant-client>=1.1.1",
    "weaviate-client>=3.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "black>=22.0.0",
    "isort>=5.12.0",
    "flake8>=5.0.0",
    "mypy>=0.9.0",
    "pre-commit>=2.20.0",
]
gpu = [
    "torch>=1.9.0",
    "nvidia-ml-py3>=7.352.0",
]

[project.scripts]
cortex = "cortex_core.cli.main:cli"
cortex-core = "cortex_core.cli.main:cli"

[project.urls]
Homepage = "https://github.com/cortex-core/cortex-core-enterprise"
Documentation = "https://cortex-core.readthedocs.io/"
Repository = "https://github.com/cortex-core/cortex-core-enterprise.git"
Issues = "https://github.com/cortex-core/cortex-core-enterprise/issues"
Changelog = "https://github.com/cortex-core/cortex-core-enterprise/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["cortex_core*"]

[tool.setuptools.package-data]
cortex_core = ["config/*.yaml", "config/*.yml"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "numpy.*",
    "pandas.*",
    "scipy.*",
    "sklearn.*",
    "fastapi.*",
    "uvicorn.*",
    "pydantic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=cortex_core --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["cortex_core"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "@abstractmethod",
    "pragma: no cover",
    "raise NotImplementedError",
]
