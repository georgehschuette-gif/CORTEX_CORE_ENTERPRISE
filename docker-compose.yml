version: '3.8'

services:
  cortex-core:
    build: .
    ports:
      - "8080:8080"  # API
      - "8081:8081"  # Metrics
    environment:
      - CORTEX_ENVIRONMENT=development
      - CORTEX_LOG_LEVEL=INFO
      - CORTEX_MODE=adaptive
      - CORTEX_API_HOST=0.0.0.0
      - CORTEX_API_PORT=8080
      - CORTEX_METRICS_PORT=8081
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - cortex-network
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cortex-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cortex
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cortex-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - cortex-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployment/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - cortex-network
    restart: unless-stopped

  # Optional: Vector database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - cortex-network
    restart: unless-stopped

networks:
  cortex-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  grafana_data:
  qdrant_data:
